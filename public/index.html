<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>제2회 한마당 지딜 몬스터 원정대</title>
  <meta name="description" content="제2회 한마당 지딜 몬스터 원정대 — 우리는 모두 지딜! 9개 커뮤니티 몬스터가 한 팀이 되어 매주 보스를 함께 물리치고, 12월 19일 현장에서 대마왕 글리치와 최종 결전을 벌여요.">
  <meta name="theme-color" content="#66ae7d">
  <link rel="icon" type="image/png" href="assets/icons/crown.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <a class="brand" href="#/home">
        <span class="brand__mark"><img class="px" src="assets/icons/crown.png" width="28" height="28" alt=""></span>
        <span class="brand__text"><b>지딜 몬스터 원정대</b><small>제2회 한마당</small></span>
      </a>
      <nav class="side-nav" id="sideNav" aria-label="메뉴"></nav>
      <div class="sidebar__foot" id="sideProfile"></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <a class="brand brand--mobile" href="#/home" aria-label="홈">
          <span class="brand__mark"><img class="px" src="assets/icons/crown.png" width="24" height="24" alt=""></span>
        </a>
        <span class="day-chip" id="dayChip"></span>
        <div class="wallet-chips" id="walletChips"></div>
        <button class="icon-btn" id="toolsBtn" data-action="settings-open" aria-label="내 정보" title="내 정보"></button>
      </header>
      <main class="view" id="view"></main>
      <footer class="foot">제2회 한마당 · 지딜 몬스터 원정대 · 우리는 모두 지딜!</footer>
    </div>

    <nav class="bottom-nav" id="bottomNav" aria-label="메뉴"></nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
